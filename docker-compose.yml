version: '3.8'

services:
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/client:/app
      - /app/node_modules    # Anonymous volume for container-only node_modules
    depends_on:
      - server

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/server:/app
      - /app/node_modules    # Anonymous volume for container-only node_modules

networks:
  default:
    driver: bridge

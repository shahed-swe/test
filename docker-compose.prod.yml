version: '3.8'

services:
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile.turbo
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.turbo
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0

networks:
  default:
    driver: bridge
